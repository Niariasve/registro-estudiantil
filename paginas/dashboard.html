<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - Registro de Actividades Estudiantiles</title>
    <link rel="stylesheet" href="../src/css/styles.css" />
    <link rel="stylesheet" href="../src/css/dashboard.css" />
  </head>
  <body data-page="dashboard">
    <header>
      <h1>Dashboard del curso</h1>
      <p>Progreso de registro y rendimiento de los estudiantes.</p>
    </header>

    <main>
      <section>
        <button id="backToHome" class="secondary">← Volver a la página principal</button>
      </section>

      <section class="dashboard-metrics">
        <article class="metric-card"><span>Clases</span><strong id="metricClasses">0</strong></article>
        <article class="metric-card"><span>Estudiantes</span><strong id="metricStudents">0</strong></article>
        <article class="metric-card"><span>Actividades</span><strong id="metricActivities">0</strong></article>
        <article class="metric-card"><span>Promedio evaluado</span><strong id="metricAverage">Sin datos</strong></article>
        <article class="metric-card"><span>Registro completado</span><strong id="metricCompletion">0 %</strong></article>
        <article class="metric-card"><span>Notas pendientes</span><strong id="metricPending">0</strong></article>
      </section>

      <p id="chartsMessage" class="muted"></p>

      <section class="dashboard-charts">
        <article class="chart-panel">
          <div class="row table-header">
            <h2>Promedio por clase</h2>
            <button id="exportClassChart" class="secondary">Exportar PNG</button>
          </div>
          <div class="chart-container"><canvas id="classAverageChart"></canvas></div>
        </article>

        <article class="chart-panel">
          <div class="row table-header">
            <h2>Distribución de estudiantes</h2>
            <button id="exportDistributionChart" class="secondary">Exportar PNG</button>
          </div>
          <div class="chart-container"><canvas id="studentDistributionChart"></canvas></div>
        </article>
      </section>

      <section>
        <h2>Resumen por clase</h2>
        <div id="dashboardClassesTable"></div>
      </section>

      <section>
        <div class="row table-header">
          <h2>Resumen por estudiante</h2>
          <div class="row">
            <input id="searchDashboardStudent" type="search" placeholder="🔍 Buscar estudiante..." class="search-input" />
            <select id="filterDashboardStatus" class="filter-select">
              <option value="all">Estado: Todos</option>
              <option value="evaluated">Estado: Evaluados</option>
              <option value="pending">Estado: Con pendientes</option>
            </select>
            <button id="exportDashboardCsv" class="secondary">Exportar CSV</button>
          </div>
        </div>
        <div id="dashboardStudentsTable"></div>
      </section>
    </main>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script src="../src/js/utils.js"></script>
    <script src="../src/js/config.js"></script>
    <script src="../src/js/storage.js"></script>
    <script src="../src/js/students.js"></script>
    <script src="../src/js/classes.js"></script>
    <script src="../src/js/class-detail.js"></script>
    <script src="../src/js/backup.js"></script>
    <script src="../src/js/dashboard.js"></script>
    <script src="../src/js/app.js"></script>
  </body>
</html>
